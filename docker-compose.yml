services:
  postgres:
    image: postgres:17-alpine
    container_name: webshop-postgres
    networks:
      - webshop-net
    environment:
      POSTGRES_DB: webshop
      POSTGRES_USER: webshop
      POSTGRES_PASSWORD: webshop
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webshop -d webshop"]
      interval: 10s
      timeout: 5s
      retries: 5

  catalog-service:
    build:
      context: ./apps/catalog-service
      dockerfile: Dockerfile
    container_name: webshop-catalog-service
    networks:
      - webshop-net
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/webshop
      SPRING_DATASOURCE_USERNAME: webshop
      SPRING_DATASOURCE_PASSWORD: webshop
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    ports:
      - "8081:8081"

  order-service:
    build:
      context: ./apps/order-service
      dockerfile: Dockerfile
    container_name: webshop-order-service
    networks:
      - webshop-net
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"

  nginx:
    image: nginx:1.27-alpine
    container_name: webshop-nginx
    networks:
      - webshop-net
    depends_on:
      catalog-service:
        condition: service_started
      order-service:
        condition: service_started
    ports:
      - "8080:80"
    volumes:
      - ./web/nginx/nginx.docker.conf:/etc/nginx/nginx.conf:ro
      - ./web/nginx/html:/usr/share/nginx/html:ro
      - ./web/nginx/assets:/usr/share/nginx/assets:ro

volumes:
  postgres-data:

networks:
  webshop-net:
    name: webshop-net
