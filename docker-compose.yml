services:
  postgres:
    image: postgres:17-alpine
    container_name: webshop-postgres
    profiles:
      - infra
      - full
    networks:
      - webshop-net
    environment:
      POSTGRES_DB: webshop
      POSTGRES_USER: webshop
      POSTGRES_PASSWORD: webshop
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U webshop -d webshop" ]
      interval: 10s
      timeout: 5s
      retries: 5

  catalog-service:
    build:
      context: ./apps/catalog-service
      dockerfile: Dockerfile
    container_name: webshop-catalog-service
    profiles:
      - full
    networks:
      - webshop-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8081/catalog/health > /dev/null" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/webshop
      SPRING_DATASOURCE_USERNAME: webshop
      SPRING_DATASOURCE_PASSWORD: webshop
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate

  order-service:
    build:
      context: ./apps/order-service
      dockerfile: Dockerfile
    container_name: webshop-order-service
    profiles:
      - full
    networks:
      - webshop-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8082/orders/health > /dev/null" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    container_name: webshop-nginx
    profiles:
      - full
    networks:
      - webshop-net
    depends_on:
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./web/nginx/nginx.docker.conf:/etc/nginx/nginx.conf:ro
      - ./web/nginx/html:/usr/share/nginx/html:ro
      - ./web/nginx/assets:/usr/share/nginx/assets:ro

  nginx-dev:
    image: nginx:1.27-alpine
    container_name: webshop-nginx-dev
    profiles:
      - infra
    networks:
      - webshop-net
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./web/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./web/nginx/html:/usr/share/nginx/html:ro
      - ./web/nginx/assets:/usr/share/nginx/assets:ro

  tailwind:
    image: node:20-alpine
    container_name: webshop-tailwind
    profiles:
      - infra
    working_dir: /workspace/web/tailwind
    command: sh -c "npm ci && npm run watch -- --poll"
    volumes:
      - ./:/workspace
      - tailwind-node-modules:/workspace/web/tailwind/node_modules

volumes:
  postgres-data:
  tailwind-node-modules:

networks:
  webshop-net:
    name: webshop-net
