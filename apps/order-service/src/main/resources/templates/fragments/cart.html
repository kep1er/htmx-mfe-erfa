<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="cartSummary" id="cart-fragment" class="rounded-lg border border-slate-200 bg-white p-5 shadow-sm">
    <h2 class="text-xl font-semibold text-slate-900">Cart</h2>
    <p class="mt-1 text-sm text-slate-600">Items: <span th:text="${itemCount}">0</span></p>

    <ul class="mt-4 space-y-3" th:if="${!#lists.isEmpty(lines)}">
        <li th:each="line : ${lines}" class="space-y-3 rounded-lg bg-slate-50 p-3" th:attr="data-sku=${line.sku}">
            <div class="rounded-lg border border-slate-200 bg-white p-3 text-sm text-slate-500"
                 data-testid="cart-item-summary-placeholder"
                 th:attr="data-item-id=${line.sku}"
                 th:hx-get="@{/catalog/fragments/item-summary/{id}(id=${line.sku})}"
                 hx-trigger="revealed"
                 hx-swap="outerHTML">
                Loading item...
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <span class="text-sm text-slate-600">Qty: <span th:text="${line.qty}">1</span></span>

                <!-- TODO(EX04): Add cart controls using htmx (no full page reload).
                     Add three buttons: decrement (-), increment (+), remove.
                     Each must POST to order-service and then replace the whole cart fragment.

                     Required:
                     - hx-target="#cart-fragment"
                     - hx-swap="outerHTML"

                     Hints (endpoints):
                     - decrement: /orders/cart/items/<sku>/decrement
                     - increment: /orders/cart/items/<sku>/increment
                     - remove:    /orders/cart/items/<sku>/remove

                     Note:
                     Use Thymeleaf to build URLs, e.g. @{/orders/cart/items/{sku}/increment(sku=${line.sku})}
                -->
                <div class="rounded border border-dashed border-slate-300 bg-white px-3 py-2 text-xs text-slate-500">
                    TODO: add + / - / remove buttons here
                </div>
            </div>
        </li>
    </ul>

    <p class="mt-3 text-sm text-slate-500" th:if="${#lists.isEmpty(lines)}">Cart is empty.</p>
</div>
</body>
</html>
