<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="cartSummary" id="cart-fragment" class="mt-4 rounded border p-4">
    <h2 class="text-lg font-semibold">Cart</h2>
    <p>Items: <span th:text="${itemCount}">0</span></p>

    <ul class="mt-3 space-y-2" th:if="${!#lists.isEmpty(lines)}">
        <li th:each="line : ${lines}" class="space-y-2 rounded bg-slate-50 p-2" th:attr="data-sku=${line.sku}">
            <div class="rounded border border-slate-200 bg-white p-3 text-sm text-slate-500"
                 data-testid="cart-item-summary-placeholder"
                 th:attr="data-item-id=${line.sku}"
                 th:hx-get="@{/catalog/fragments/item-summary/{id}(id=${line.sku})}"
                 hx-trigger="revealed"
                 hx-swap="outerHTML">
                Loading item...
            </div>
            <div class="flex items-center gap-2">
                <span class="text-sm text-slate-600">Qty: <span th:text="${line.qty}">1</span></span>
                <button type="button"
                        class="rounded border border-slate-300 px-2 py-1 text-sm"
                        th:hx-post="@{/orders/cart/items/{sku}/decrement(sku=${line.sku})}"
                        hx-target="#cart-fragment"
                        hx-swap="outerHTML">
                    -
                </button>
                <button type="button"
                        class="rounded border border-slate-300 px-2 py-1 text-sm"
                        th:hx-post="@{/orders/cart/items/{sku}/increment(sku=${line.sku})}"
                        hx-target="#cart-fragment"
                        hx-swap="outerHTML">
                    +
                </button>
                <button type="button"
                        class="rounded border border-red-300 px-2 py-1 text-sm text-red-700"
                        th:hx-post="@{/orders/cart/items/{sku}/remove(sku=${line.sku})}"
                        hx-target="#cart-fragment"
                        hx-swap="outerHTML">
                    remove
                </button>
            </div>
        </li>
    </ul>

    <p class="mt-2 text-slate-500" th:if="${#lists.isEmpty(lines)}">Cart is empty.</p>
</div>
</body>
</html>
