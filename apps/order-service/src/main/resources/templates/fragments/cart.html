<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="cartSummary" id="cart-fragment" class="rounded-lg border border-slate-200 bg-white p-5 shadow-sm">
    <h2 class="text-xl font-semibold text-slate-900">Cart</h2>
    <p class="mt-1 text-sm text-slate-600">Items: <span th:text="${itemCount}">0</span></p>

    <ul class="mt-4 space-y-3" th:if="${!#lists.isEmpty(lines)}">
        <li th:each="line : ${lines}" class="space-y-3 rounded-lg bg-slate-50 p-3" th:attr="data-sku=${line.sku}">
            <div class="rounded-lg border border-slate-200 bg-white p-3 text-sm text-slate-500"
                 data-testid="cart-item-summary-placeholder"
                 th:attr="data-item-id=${line.sku}"
                 th:hx-get="@{/catalog/fragments/item-summary/{id}(id=${line.sku})}"
                 hx-trigger="revealed"
                 hx-swap="outerHTML">
                Loading item...

                <!-- TODO(EX06): Add a loading indicator while the summary fragment is being fetched.
                     Hint: Use hx-indicator and an element with class "htmx-indicator" (spinner).
                -->

                <!-- TODO(EX06): Add an error fallback when the request fails (e.g. catalog is down / 502).
                     Hint: Use hx-on::response-error and hx-on::send-error to replace this placeholder content
                     with a friendly message.
                -->
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <span class="text-sm text-slate-600">Qty: <span th:text="${line.qty}">1</span></span>
                <button type="button"
                        class="btn-secondary"
                        th:hx-post="@{/orders/cart/items/{sku}/decrement(sku=${line.sku})}"
                        hx-target="#cart-fragment"
                        hx-swap="outerHTML">
                    -
                </button>
                <button type="button"
                        class="btn-secondary"
                        th:hx-post="@{/orders/cart/items/{sku}/increment(sku=${line.sku})}"
                        hx-target="#cart-fragment"
                        hx-swap="outerHTML">
                    +
                </button>
                <button type="button"
                        class="btn-secondary border-red-300 text-red-700 hover:bg-red-50"
                        th:hx-post="@{/orders/cart/items/{sku}/remove(sku=${line.sku})}"
                        hx-target="#cart-fragment"
                        hx-swap="outerHTML">
                    remove
                </button>
            </div>
        </li>
    </ul>

    <p class="mt-3 text-sm text-slate-500" th:if="${#lists.isEmpty(lines)}">Cart is empty.</p>
</div>
</body>
</html>
