<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<article th:fragment="summary"
         class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm"
         data-testid="item-summary"
         th:attr="data-item-id=${item.id}">
    <div class="flex items-start gap-3">
        <div class="h-16 w-16 shrink-0 overflow-hidden rounded bg-slate-100">
            <th:block th:if="${!#strings.isEmpty(item.image)}">
                <img th:src="${item.image}"
                     th:alt="${item.name}"
                     class="h-full w-full object-cover"
                     onerror="this.classList.add('hidden'); this.nextElementSibling.classList.remove('hidden');"/>
                <div class="hidden h-full w-full items-center justify-center bg-slate-200 text-[10px] font-semibold uppercase tracking-wide text-slate-500">
                    No image
                </div>
            </th:block>
            <div th:if="${#strings.isEmpty(item.image)}"
                 class="flex h-full w-full items-center justify-center bg-slate-200 text-[10px] font-semibold uppercase tracking-wide text-slate-500">
                No image
            </div>
        </div>
        <div class="min-w-0">
            <p class="font-semibold text-slate-900" th:text="${item.name}">Item Name</p>
            <p class="text-sm text-slate-600">
                <span th:text="${item.category}">Category</span>
                <span> · </span>
                <span class="uppercase tracking-wide" th:text="${item.rarity.value()}">common</span>
            </p>
            <p class="text-sm text-slate-600">
                <span th:text="${'$' + #numbers.formatDecimal(item.price, 1, 2)}">$0.00</span>
                <span> · Stock: </span>
                <span th:text="${item.stock}">0</span>
            </p>
        </div>
    </div>
</article>

<article th:fragment="summaryNotFound"
         class="rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-700"
         data-testid="item-summary-not-found"
         th:attr="data-item-id=${itemId}">
    Item summary unavailable.
</article>
</body>
</html>
