<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="detailCard" class="space-y-4">
    <h3 class="text-base font-semibold text-slate-900">Item Details</h3>

    <div class="rounded-lg border border-dashed border-slate-300 bg-slate-50 p-4 text-slate-600" th:if="${item == null}">
        Select an item to view details.
    </div>

    <div class="space-y-4" th:if="${item != null}">
        <div>
            <p class="text-base font-semibold text-slate-900" th:text="${item.name}">Item Name</p>
            <p class="mt-1 text-sm text-slate-600" th:text="${item.description}" th:if="${!#strings.isEmpty(item.description)}">
                Description
            </p>
        </div>

        <section class="space-y-1 border-t border-slate-200 pt-3" th:if="${!#strings.isEmpty(item.lore)}">
            <h4 class="text-xs font-semibold uppercase tracking-wide text-slate-500">Lore</h4>
            <p class="text-sm" th:text="${item.lore}">Lore text</p>
        </section>

        <section class="space-y-1 border-t border-slate-200 pt-3" th:if="${!#lists.isEmpty(item.effects)}">
            <h4 class="text-xs font-semibold uppercase tracking-wide text-slate-500">Effects</h4>
            <ul class="list-disc space-y-1 pl-5 text-sm">
                <li th:each="effect : ${item.effects}" th:text="${effect}">Effect</li>
            </ul>
        </section>

        <section class="space-y-1 border-t border-slate-200 pt-3" th:if="${!#lists.isEmpty(item.materials)}">
            <h4 class="text-xs font-semibold uppercase tracking-wide text-slate-500">Materials</h4>
            <ul class="list-disc space-y-1 pl-5 text-sm">
                <li th:each="material : ${item.materials}" th:text="${material}">Material</li>
            </ul>
        </section>

        <section class="space-y-1 border-t border-slate-200 pt-3"
                 th:if="${item.dimensions != null and (item.dimensions.lengthMm != null or item.dimensions.widthMm != null or item.dimensions.heightMm != null)}">
            <h4 class="text-xs font-semibold uppercase tracking-wide text-slate-500">Dimensions (mm)</h4>
            <p class="text-sm">
                <span th:text="${item.dimensions.lengthMm != null ? item.dimensions.lengthMm : '-'}">0</span>
                <span> x </span>
                <span th:text="${item.dimensions.widthMm != null ? item.dimensions.widthMm : '-'}">0</span>
                <span> x </span>
                <span th:text="${item.dimensions.heightMm != null ? item.dimensions.heightMm : '-'}">0</span>
            </p>
        </section>

        <section class="space-y-1 border-t border-slate-200 pt-3" th:if="${!#lists.isEmpty(item.warnings)}">
            <h4 class="text-xs font-semibold uppercase tracking-wide text-slate-500">Warnings</h4>
            <ul class="list-disc space-y-1 pl-5 text-sm">
                <li th:each="warning : ${item.warnings}" th:text="${warning}">Warning</li>
            </ul>
        </section>
    </div>
</section>
</body>
</html>
