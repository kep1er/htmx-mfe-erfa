<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="productList" class="rounded border p-4">
    <h2 class="text-lg font-semibold">Demo Catalog</h2>
    <ul class="mt-3 space-y-2">
        <li th:each="product : ${products}" class="flex items-center justify-between rounded bg-gray-50 p-2">
            <span th:text="${product.name}">Product</span>
            <span th:text="${'$' + #numbers.formatDecimal(product.priceCents / 100.0, 1, 2)}">$0.00</span>
        </li>
    </ul>
</section>
</body>
</html>
