<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="productList" data-testid="catalog-view" class="space-y-4">
    <div class="rounded-lg border border-slate-200 bg-white p-5 shadow-sm">
        <h2 class="text-xl font-semibold text-slate-900">Magical Items</h2>
        <p class="mt-1 text-sm text-slate-600">Browse the catalog and open item details alongside the list.</p>
    </div>

    <div class="grid gap-6 lg:grid-cols-[minmax(0,1fr)_420px] lg:items-start">
        <div class="space-y-3">
            <p class="rounded-lg border border-slate-200 bg-white p-5 text-sm text-slate-600 shadow-sm"
               data-testid="catalog-empty"
               th:if="${#lists.isEmpty(items)}">
                No magical items found for the current filters.
            </p>

            <ul class="space-y-3" th:if="${!#lists.isEmpty(items)}">
                <li th:each="item : ${items}"
                    th:classappend="${item.id == selected} ? ' ring-2 ring-slate-900/10 border-slate-300' : ''"
                    class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
                    <div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
                        <div class="min-w-0 flex-1">
                            <div th:replace="~{fragments/item-summary :: summary}" th:with="item=${item}"></div>
                        </div>
                        <div class="flex shrink-0 flex-wrap items-center gap-2 lg:justify-end">
                            <!-- TODO(EX03): Wire up this button with htmx so it loads the item detail into the right panel AND deep-links.
                               Required behavior:
                                 1) Load the detail fragment into #catalog-detail (no full page reload)
                                 2) Update the browser URL to /?selected=<item.id>

                               Hint (detail fragment URL):
                                 /catalog/fragments/items/<item.id>

                               Required htmx attributes to add on the button:
                                 - hx-get="..."
                                 - hx-target="#catalog-detail"
                                 - hx-swap="innerHTML"
                                 - hx-push-url="..."   (should become "/?selected=<item.id>")
                            -->
                            <button type="button"
                                    class="btn-secondary"
                                    th:attr="data-item-id=${item.id}">
                                View details
                            </button>

                            <form hx-post="/orders/cart/items"
                                  hx-swap="none">
                                <input type="hidden" name="sku" th:value="${item.id}">
                                <input type="hidden" name="qty" value="1">
                                <button type="submit" class="btn-primary">
                                    Add to cart
                                </button>
                            </form>
                        </div>
                    </div>
                </li>
            </ul>
        </div>

        <!-- TODO(EX03): Support deep links:
            If a 'selected' query param is present in the request, the detail panel should auto-load
            /catalog/fragments/items/<selected> on initial render (hx-trigger="load").
       -->
        <div id="catalog-detail"
             class="rounded-xl border border-slate-200 bg-white p-5 text-sm text-slate-600 shadow-sm lg:sticky lg:top-24">
            <h3 class="text-base font-semibold text-slate-900">Item Details</h3>
            <p class="mt-2">Select an item to view details.</p>
        </div>
    </div>
</section>
</body>
</html>
