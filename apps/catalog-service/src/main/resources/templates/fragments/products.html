<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="productList" class="rounded border p-4">
    <h2 class="text-lg font-semibold">Magical Items</h2>
    <form class="mt-3 grid gap-2 md:grid-cols-3"
          hx-get="/catalog/fragments/products"
          hx-target="#catalog-products"
          hx-swap="innerHTML"
          hx-trigger="keyup changed delay:300ms">
        <input id="catalog-search-input"
               name="q"
               type="text"
               placeholder="Search name, category, or tag"
               th:value="${currentQ}"
               class="rounded border px-3 py-2 text-sm"/>
        <select id="catalog-rarity-select" name="rarity" class="rounded border px-3 py-2 text-sm">
            <option value="" th:selected="${#strings.isEmpty(currentRarity)}">All rarities</option>
            <option value="common" th:selected="${currentRarity == 'common'}">common</option>
            <option value="uncommon" th:selected="${currentRarity == 'uncommon'}">uncommon</option>
            <option value="rare" th:selected="${currentRarity == 'rare'}">rare</option>
            <option value="legendary" th:selected="${currentRarity == 'legendary'}">legendary</option>
        </select>
        <select id="catalog-category-select" name="category" class="rounded border px-3 py-2 text-sm">
            <option value="" th:selected="${#strings.isEmpty(currentCategory)}">All categories</option>
            <option th:each="cat : ${categories}"
                    th:value="${cat}"
                    th:text="${cat}"
                    th:selected="${currentCategory == cat}">
                Category
            </option>
        </select>
    </form>

    <p class="mt-4 rounded bg-slate-50 p-3 text-sm text-slate-600" th:if="${#lists.isEmpty(items)}">
        No magical items found for the current filters.
    </p>

    <ul class="mt-4 space-y-2" th:if="${!#lists.isEmpty(items)}">
        <li th:each="item : ${items}" class="flex items-center justify-between gap-3 rounded bg-slate-50 p-2">
            <div class="min-w-0">
                <p class="font-medium" th:text="${item.name}">Item Name</p>
                <p class="text-sm text-slate-600">
                    <span th:text="${item.category}">Category</span>
                    <span> · </span>
                    <span class="uppercase" th:text="${item.rarity.value()}">common</span>
                </p>
                <p class="text-sm text-slate-600">
                    Stock: <span th:text="${item.stock}">0</span>
                </p>
            </div>
            <div class="flex items-center gap-3">
                <span th:text="${'$' + #numbers.formatDecimal(item.price, 1, 2)}">$0.00</span>
                <button type="button"
                        class="rounded border border-slate-300 px-3 py-1 text-sm text-slate-700"
                        th:attr="data-item-id=${item.id}"
                        th:hx-get="@{/catalog/fragments/items/{id}(id=${item.id})}"
                        hx-target="#catalog-detail"
                        hx-swap="innerHTML">
                    View details
                </button>
                <form hx-post="/orders/cart/items"
                      hx-target="#cart-fragment"
                      hx-swap="outerHTML">
                    <input type="hidden" name="sku" th:value="${item.id}">
                    <input type="hidden" name="qty" value="1">
                    <button type="submit" class="rounded bg-slate-900 px-3 py-1 text-sm text-white">
                        Add to cart
                    </button>
                </form>
            </div>
        </li>
    </ul>
</section>
</body>
</html>
