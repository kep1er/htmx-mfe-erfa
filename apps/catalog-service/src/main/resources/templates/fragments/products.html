<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="productList" class="rounded border p-4">
    <h2 class="text-lg font-semibold">Demo Catalog</h2>
    <ul class="mt-3 space-y-2">
        <li th:each="product : ${products}" class="flex items-center justify-between gap-3 rounded bg-slate-50 p-2">
            <div class="min-w-0">
                <p class="font-medium" th:text="${product.name}">Product</p>
                <p class="text-sm text-slate-600" th:text="${product.sku}">DEMO-SKU</p>
            </div>
            <div class="flex items-center gap-3">
                <span th:text="${'$' + #numbers.formatDecimal(product.priceCents / 100.0, 1, 2)}">$0.00</span>
                <form hx-post="/orders/cart/items"
                      hx-target="#cart-fragment"
                      hx-swap="outerHTML">
                    <input type="hidden" name="sku" th:value="${product.sku}">
                    <input type="hidden" name="qty" value="1">
                    <button type="submit" class="rounded bg-slate-900 px-3 py-1 text-sm text-white">
                        Add to cart
                    </button>
                </form>
            </div>
        </li>
    </ul>
</section>
</body>
</html>
