<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Webshop Demo Shell</title>
    <link rel="stylesheet" href="/assets/css/app.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script type="module" src="/assets/ui-components/shop-badge.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
<header class="sticky top-0 z-10 border-b bg-white/95 shadow-sm backdrop-blur">
    <div class="mx-auto flex max-w-6xl flex-col gap-4 px-4 py-4 md:flex-row md:items-center md:justify-between">
        <div class="flex items-center gap-3">
            <a id="nav-home"
               href="/"
               class="text-xl font-bold text-slate-900"
               hx-get="/catalog/fragments/products"
               hx-target="#app-main"
               hx-swap="innerHTML"
               hx-push-url="/">
                Webshop
            </a>
            <shop-badge label="Bootstrap Step 1"></shop-badge>
        </div>

        <form id="topbar-catalog-form"
              class="w-full md:max-w-3xl"
              data-testid="topbar-catalog-form"
              hx-get="/catalog/fragments/products"
              hx-target="#app-main"
              hx-swap="innerHTML"
              hx-push-url="true"
              hx-trigger="submit">
            <input id="topbar-rarity-input" name="rarity" type="hidden" value="">
            <input id="topbar-category-input" name="category" type="hidden" value="">
            <div class="space-y-2">
                <input id="topbar-search-input"
                       data-testid="topbar-search-input"
                       name="q"
                       type="search"
                       placeholder="Search magical items"
                       class="w-full rounded border border-slate-300 px-3 py-2 text-sm"/>
                <div class="flex flex-wrap items-center gap-2 text-xs md:text-sm">
                    <span class="font-semibold text-slate-600">Rarity:</span>
                    <button type="button" data-pill-key="rarity" data-pill-value="common" class="rounded-full border border-slate-300 px-3 py-1">common</button>
                    <button type="button" data-pill-key="rarity" data-pill-value="uncommon" class="rounded-full border border-slate-300 px-3 py-1">uncommon</button>
                    <button type="button" data-pill-key="rarity" data-pill-value="rare" class="rounded-full border border-slate-300 px-3 py-1">rare</button>
                    <button type="button" data-pill-key="rarity" data-pill-value="legendary" class="rounded-full border border-slate-300 px-3 py-1">legendary</button>
                    <span class="ml-2 font-semibold text-slate-600">Category:</span>
                    <button type="button" data-pill-key="category" data-pill-value="Curios" class="rounded-full border border-slate-300 px-3 py-1">Curios</button>
                    <button type="button" data-pill-key="category" data-pill-value="Arcana" class="rounded-full border border-slate-300 px-3 py-1">Arcana</button>
                    <button type="button" data-pill-key="category" data-pill-value="Apparel" class="rounded-full border border-slate-300 px-3 py-1">Apparel</button>
                    <button id="topbar-clear-filters" type="button" class="ml-2 rounded border border-slate-400 px-3 py-1 text-slate-700">
                        Clear
                    </button>
                </div>
            </div>
        </form>

        <div class="flex items-center justify-end">
            <a id="nav-health"
               href="/health"
               class="mr-2 rounded border border-slate-300 px-3 py-2 text-sm font-semibold text-slate-700"
               hx-get="/fragments/health-view.html"
               hx-target="#app-main"
               hx-swap="innerHTML"
               hx-push-url="/health">
                Health
            </a>
            <a id="nav-cart"
               href="/cart"
               data-testid="nav-cart"
               class="rounded bg-slate-900 px-4 py-2 text-sm font-semibold text-white"
               hx-get="/orders/fragments/cart"
               hx-target="#app-main"
               hx-swap="innerHTML"
               hx-push-url="/cart">
                Cart
            </a>
        </div>
    </div>
</header>

<main id="app-main" data-testid="app-main" class="mx-auto max-w-6xl px-4 py-6 md:py-8">
    <div class="rounded border bg-white p-4 text-sm text-slate-600">Loading view...</div>
</main>
<script src="/assets/js/app.js"></script>
</body>
</html>
