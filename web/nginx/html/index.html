<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Webshop Demo Shell</title>
    <link rel="stylesheet" href="/assets/css/app.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>

<body class="min-h-screen bg-slate-100 text-slate-900">
<header class="sticky top-0 z-10 border-b border-slate-200 bg-white/95 shadow-sm backdrop-blur">
    <div class="mx-auto w-full max-w-5xl px-4 py-4">
        <div class="flex flex-col gap-4 lg:flex-row lg:items-start lg:space-between">
            <!-- TODO: EX01 change the buttons to replace the content of #app-main instead of routing
                update the url as well
                the fragments endpoints are:
                - /catalog/fragments/products
                - /orders/fragments/cart
             -->
            <a id="nav-home"
               href="/"
               class="btn-secondary">
                Catalog
            </a>
            <a id="nav-health"
               href="/cart"
               class="btn-secondary">
                Cart
            </a>
        </div>
    </div>
</header>

<main id="app-main" data-testid="app-main" class="mx-auto w-full max-w-5xl px-4 py-6 md:py-8">
    <div class="rounded-lg border border-slate-200 bg-white p-5 text-sm text-slate-600 shadow-sm">Loading view...</div>
</main>
<script src="/assets/js/app.js"></script>
