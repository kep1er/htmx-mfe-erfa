<section data-testid="health-view" class="grid gap-4 md:grid-cols-2">
    <article class="rounded border bg-white p-4 shadow-sm">
        <div class="mb-3 flex items-center justify-between">
            <h2 class="text-lg font-semibold">Catalog Health</h2>
            <button class="btn-secondary"
                    hx-get="/catalog/fragments/health"
                    hx-target="#catalog-health"
                    hx-swap="innerHTML">
                Refresh
            </button>
        </div>
        <div id="catalog-health"
             hx-get="/catalog/fragments/health"
             hx-trigger="load"
             hx-swap="innerHTML">
            Loading catalog health...
        </div>
    </article>
    <article class="rounded border bg-white p-4 shadow-sm">
        <div class="mb-3 flex items-center justify-between">
            <h2 class="text-lg font-semibold">Order Health</h2>
            <button class="btn-secondary"
                    hx-get="/orders/fragments/health"
                    hx-target="#order-health"
                    hx-swap="innerHTML">
                Refresh
            </button>
        </div>
        <div id="order-health"
             hx-get="/orders/fragments/health"
             hx-trigger="load"
             hx-swap="innerHTML">
            Loading order health...
        </div>
    </article>
</section>
